name: Daily Real Estate Scanner

on:
  schedule:
    # 매일 한국시간 오전 8:00 (UTC 기준 23:00)
    - cron: '17 23 * * *'
  workflow_dispatch: # 수동으로 버튼을 눌러서 실행할 수 있도록 허용

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Background Scanner & Sentiment Crawler
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python sentiment_crawler.py
        python alert_server.py

    - name: Commit sentiment data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sentiment.json || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sentiment data" && git push)
