name: Daily Sniper Scan

on:
  schedule:
    # 한국 시간 기준 아침 7시 37분 (UTC 22:37)
    - cron: '37 22 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4
      
      - name: Run Sniper Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPEEDAUCTION_ID: ${{ secrets.SPEEDAUCTION_ID }}
          SPEEDAUCTION_PW: ${{ secrets.SPEEDAUCTION_PW }}
        run: |
          python gap_sniper.py
